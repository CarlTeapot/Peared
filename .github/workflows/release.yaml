name: PeerCode Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            gateway_ext: ""
            args: ""
          - name: macOS
            os: macos-15-intel
            target: x86_64-apple-darwin
            gateway_ext: ""
            args: ""
          - name: macOS ARM
            os: macos-15
            target: aarch64-apple-darwin
            gateway_ext: ""
            args: "--target aarch64-apple-darwin"
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            gateway_ext: ".exe"
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          check-latest: true
          cache-dependency-path: gateway/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci
        working-directory: tauri-app

      - name: Build gateway sidecar
        shell: bash
        run: |
          bash build/scripts/build-gateway.sh \
            "${{ matrix.target }}" \
            "tauri-app/src-tauri/binaries/peercode-gateway-${{ matrix.target }}${{ matrix.gateway_ext }}"

      - name: Install cloudflared sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cloudflared
          mkdir -p tauri-app/src-tauri/binaries
          cp "$(command -v cloudflared)" "tauri-app/src-tauri/binaries/cloudflared-${{ matrix.target }}"
          chmod +x "tauri-app/src-tauri/binaries/cloudflared-${{ matrix.target }}"
          "tauri-app/src-tauri/binaries/cloudflared-${{ matrix.target }}" --version

      - name: Install cloudflared sidecar (Linux/Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: bash build/scripts/install-cloudflared.sh

      - name: Publish Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app
          tagName: ${{ github.ref_name }}
          releaseName: PeerCode ${{ github.ref_name }}
          releaseBody: |
            Release builds for Linux, macOS Intel, macOS ARM, and Windows.

            The gateway sidecar is bundled inside each desktop app by Tauri's externalBin configuration.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
